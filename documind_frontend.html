<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Analyzer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0f1117;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #1a1d27;
            padding: 16px 24px;
            border-bottom: 1px solid #2a2d3e;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        header h1 {
            font-size: 20px;
            color: #7c6af7;
        }

        header span {
            font-size: 13px;
            color: #888;
        }

        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* LEFT PANEL - PDF Upload */
        .left-panel {
            width: 360px;
            background: #1a1d27;
            border-right: 1px solid #2a2d3e;
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 16px;
            overflow-y: auto;
        }

        .upload-area {
            border: 2px dashed #3a3d4e;
            border-radius: 12px;
            padding: 32px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .upload-area:hover {
            border-color: #7c6af7;
            background: #1e2035;
        }

        .upload-area .icon { font-size: 36px; margin-bottom: 10px; }
        .upload-area p { font-size: 14px; color: #888; }
        .upload-area strong { color: #7c6af7; }

        #pdf-input { display: none; }

        .btn {
            background: #7c6af7;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.2s;
            width: 100%;
        }

        .btn:hover { background: #6a58e0; }
        .btn:disabled { background: #3a3d4e; cursor: not-allowed; }

        .results-area {
            flex: 1;
            overflow-y: auto;
        }

        .results-area h3 {
            font-size: 13px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .page-card {
            background: #0f1117;
            border: 1px solid #2a2d3e;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 10px;
        }

        .page-card .page-num {
            font-size: 12px;
            color: #7c6af7;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .page-card .page-text {
            font-size: 13px;
            color: #bbb;
            line-height: 1.6;
            max-height: 120px;
            overflow-y: auto;
        }

        /* RIGHT PANEL - Chat */
        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 75%;
            padding: 14px 18px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.6;
        }

        .message.user {
            background: #7c6af7;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message.bot {
            background: #1a1d27;
            color: #e0e0e0;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid #2a2d3e;
        }

        .message.bot.loading {
            color: #888;
            font-style: italic;
        }

        .chat-input-area {
            padding: 20px 24px;
            background: #1a1d27;
            border-top: 1px solid #2a2d3e;
            display: flex;
            gap: 12px;
        }

        .chat-input-area input {
            flex: 1;
            background: #0f1117;
            border: 1px solid #2a2d3e;
            color: #e0e0e0;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .chat-input-area input:focus { border-color: #7c6af7; }

        .chat-input-area button {
            background: #7c6af7;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.2s;
        }

        .chat-input-area button:hover { background: #6a58e0; }

        .welcome-msg {
            text-align: center;
            color: #444;
            margin: auto;
        }

        .welcome-msg h2 { font-size: 24px; margin-bottom: 8px; color: #555; }
        .welcome-msg p { font-size: 14px; }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #444;
            border-top-color: #7c6af7;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .status-bar {
            font-size: 12px;
            color: #888;
            text-align: center;
            padding: 4px;
        }

        .status-bar.success { color: #4caf50; }
        .status-bar.error { color: #f44336; }
    </style>
</head>
<body>

<header>
    <h1> PDF Analyzer</h1>
    <span>Upload a PDF and chat with it</span>
</header>

<div class="container">

    <!-- LEFT: PDF Upload -->
    <div class="left-panel">
        <div class="upload-area" onclick="document.getElementById('pdf-input').click()">
            <div class="icon"></div>
            <p>Click to upload a <strong>PDF file</strong></p>
            <p id="file-name" style="margin-top:8px; color:#7c6af7;"></p>
        </div>
        <input type="file" id="pdf-input" accept=".pdf" onchange="onFileSelected(event)">

        <button class="btn" id="analyze-btn" onclick="analyzePDF()" disabled>
            Analyze PDF
        </button>

        <div class="status-bar" id="status-bar"></div>

        <div class="results-area" id="results-area" style="display:none;">
            <h3>Page Explanations</h3>
            <div id="page-cards"></div>
        </div>
    </div>

    <!-- RIGHT: Chat -->
    <div class="right-panel">
        <div class="chat-messages" id="chat-messages">
            <div class="welcome-msg">
                <h2> Hello!</h2>
                <p>Upload a PDF on the left, then ask me anything about it.</p>
            </div>
        </div>

        <div class="chat-input-area">
            <input
                type="text"
                id="chat-input"
                placeholder="Ask a question..."
                onkeypress="if(event.key==='Enter') sendMessage()"
            />
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

</div>

<script>
    const API = 'http://127.0.0.1:8005/api';
    const conversationId = 'user_' + Math.random().toString(36).substr(2, 9);
    let selectedFile = null;

    function onFileSelected(event) {
        selectedFile = event.target.files[0];
        if (selectedFile) {
            document.getElementById('file-name').textContent = selectedFile.name;
            document.getElementById('analyze-btn').disabled = false;
        }
    }

    async function analyzePDF() {
        if (!selectedFile) return;

        const btn = document.getElementById('analyze-btn');
        const statusBar = document.getElementById('status-bar');

        btn.disabled = true;
        btn.innerHTML = '<span class="loading-spinner"></span> Analyzing...';
        statusBar.textContent = 'Extracting and analyzing pages...';
        statusBar.className = 'status-bar';

        const formData = new FormData();
        formData.append('file', selectedFile);

        try {
            const res = await fetch(`${API}/analyze-pdf`, {
                method: 'POST',
                body: formData
            });

            const data = await res.json();

            // show results
            const pageCards = document.getElementById('page-cards');
            pageCards.innerHTML = '';

            data.results.forEach(r => {
                const card = document.createElement('div');
                card.className = 'page-card';
                card.innerHTML = `
                    <div class="page-num"> Page ${r.page}</div>
                    <div class="page-text">${r.explanation}</div>
                `;
                pageCards.appendChild(card);
            });

            document.getElementById('results-area').style.display = 'block';
            statusBar.textContent = ` ${data.total_pages} pages analyzed!`;
            statusBar.className = 'status-bar success';

            // add welcome message to chat
            addMessage('bot', `I've analyzed your PDF (${data.total_pages} pages). Ask me anything about it!`);

        } catch (err) {
            statusBar.textContent = ' Error analyzing PDF. Is the server running?';
            statusBar.className = 'status-bar error';
        }

        btn.disabled = false;
        btn.textContent = 'Analyze PDF';
    }

    async function sendMessage() {
        const input = document.getElementById('chat-input');
        const query = input.value.trim();
        if (!query) return;

        input.value = '';
        addMessage('user', query);

        // loading indicator
        const loadingId = addMessage('bot', '<span class="loading-spinner"></span> Thinking...', true);

        try {
            const res = await fetch(`${API}/query`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query, conversation_id: conversationId })
            });

            const data = await res.json();
            removeMessage(loadingId);
            addMessage('bot', data.answer || 'Sorry, I could not find an answer.');

        } catch (err) {
            removeMessage(loadingId);
            addMessage('bot', ' Error connecting to server. Is it running?');
        }
    }

    function addMessage(role, text, isLoading = false) {
        const messages = document.getElementById('chat-messages');

        // remove welcome message on first chat
        const welcome = messages.querySelector('.welcome-msg');
        if (welcome) welcome.remove();

        const id = 'msg_' + Date.now();
        const div = document.createElement('div');
        div.className = `message ${role}${isLoading ? ' loading' : ''}`;
        div.id = id;
        div.innerHTML = text;
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
        return id;
    }

    function removeMessage(id) {
        const el = document.getElementById(id);
        if (el) el.remove();
    }
</script>

</body>
</html>
